# YouTubeチャンネル「リンク」ウィジェット 正解データ(2026-07-13 ソル裁定)
#
# 背景: このリンクはYouTube Studio UIでのみ編集可能で、Data API v3の brandingSettings には
#   含まれない。そのためコード側の説明文(caption等)を更新しても、このリンクだけ自動反映されず
#   長期間放置されていた(Yahoo旧URL・LINE旧ID・みほの死んだHyperFollowリンクが残存する事故が
#   2026-07-13に発覚)。再発防止のため、正解をここに一元管理する。
#
# 運用ルール:
#   1. リンクを変更する必要が生じたら、まずこのYAMLを更新する
#   2. 次に functions/go/t/[[path]].js の PROFILE_ROUTES を同じ内容に更新する
#   3. 最後にYouTube Studio → カスタマイズ → 基本情報 → リンク を手動で更新する
#      (Studio UIのみでAPI操作不可のため、Playwright自動化 or 手動)
#   4. last_verified を更新日に変更する
#
# 1番目のリンクは季節でローテーションする想定:
#   予約期(現在〜発送開始): 令和8年産 新米予約｜公式
#   通常販売期:            富士山麓のお米を購入｜公式
#   完売・端境期:          FUJI RICE 公式サイト（または次回の新米情報｜公式）
#   → 収穫カウントダウン(HARVEST_DATE, fuji_live_stream.py)が0になったら見直しの合図。

